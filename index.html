    <title>Geno's Euro Garage | Mobile Auto Service</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a202c;
            /* Textured dark carbon background */
            background-image: 
                radial-gradient(#2d3748 15%, transparent 16%),
                radial-gradient(#2d3748 15%, transparent 16%);
            background-size: 12px 12px;
            background-position: 0 0, 6px 6px;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px 60px 20px;
        }

        /* Torn paper container (White for high contrast) */
        .tear-container {
            position: relative;
            max-width: 580px;
            width: 100%;
            background-color: #ffffff;
            padding: 45px 35px 35px 35px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-left: 8px solid #ffffff;
            border-right: 8px solid #ffffff;
        }

        /* Top torn paper edge effect */
        .tear-container::before {
            content: "";
            position: absolute;
            top: -20px;
            left: -8px;
            right: -8px;
            height: 20px;
            background: linear-gradient(135deg, transparent 33.333%, #ffffff 33.333%, #ffffff 66.666%, transparent 66.666%),
                        linear-gradient(45deg, transparent 33.333%, #ffffff 33.333%, #ffffff 66.666%, transparent 66.666%);
            background-size: 16px 32px;
            background-position: 0 -16px;
        }

        /* Logo Image Display */
        .logo-img {
            src="logo.png"
            max-width: 260px;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            display: inline-block;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #334155;
            margin-bottom: 25px;
        }

        /* Vehicle Inquiry Form CTA Button */
        .cta-container {
            margin-bottom: 25px;
        }

        .btn-inquiry {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.3);
        }

        .btn-inquiry:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px -1px rgba(2, 132, 199, 0.4);
        }

        /* Clean Sans-Serif Inline Links */
        .nav-links {
            font-size: 0.9rem;
            color: #475569;
            margin-bottom: 25px;
            line-height: 1.8;
            border-top: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 0;
        }

        .nav-links a {
            color: #0f172a;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #0284c7;
            text-decoration: underline;
        }

        .separator {
            margin: 0 8px;
            color: #cbd5e1;
            font-weight: 300;
        }

        .footer-text {
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
