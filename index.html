<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geno's Euro Garage | Website Coming Soon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a202c;
            /* Textured carbon pattern background */
            background-image: 
                radial-gradient(#2d3748 15%, transparent 16%),
                radial-gradient(#2d3748 15%, transparent 16%);
            background-size: 12px 12px;
            background-position: 0 0, 6px 6px;
            color: #f7fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Torn paper container */
        .tear-container {
            position: relative;
            max-width: 550px;
            width: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 50px 30px 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-left: 8px solid #ffffff;
            border-right: 8px solid #ffffff;
        }

        /* Top torn paper edge effect */
        .tear-container::before {
            content: "";
            position: absolute;
            top: -20px;
            left: -8px;
            right: -8px;
            height: 20px;
            background: linear-gradient(135deg, transparent 33.333%, #ffffff 33.333%, #ffffff 66.666%, transparent 66.666%),
                        linear-gradient(45deg, transparent 33.333%, #ffffff 33.333%, #ffffff 66.666%, transparent 66.666%);
            background-size: 16px 32px;
            background-position: 0 -16px;
        }

        /* Bottom rolled paper roll effect */
        .paper-roll {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 35px;
            background: linear-gradient(to bottom, #e2e8f0 0%, #cbd5e1 50%, #94a3b8 100%);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border-top: 2px solid #64748b;
        }

        /* Logo styling */
        .logo-img {
            max-width: 220px;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 25px;
            border-top: 1px dashed #475569;
            border-bottom: 1px dashed #475569;
            padding: 8px 0;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        /* Call-to-action buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .btn {
            display: block;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #0284c7;
            color: #ffffff;
        }

        .btn-secondary {
            background-color: #334155;
            color: #ffffff;
            border: 1px solid #475569;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="tear-container">
        <!-- Logo Image -->
        <img src="logo.png" alt="Geno's Euro Garage Logo" class="logo-img">

        <h1>Website</h1>
        <div class="subtitle">Coming Soon</div>

        <p>Mobile automotive service, serving Northeast Georgia & Upstate South Carolina. Dealer-level care delivered straight to your driveway.</p>

        <div class="btn-group">
            <a href="tel:17069”630193 class="btn btn-primary">📞 Call / Text Us</a>
            <a href="https://facebook.com" target="https://www.facebook.com/genoseurogarage" class="btn btn-secondary">📘 Facebook Page</a>
        </div>

        <div class="footer-text">
            &copy; 2026 Geno's Euro Garage LLC. All rights reserved.
        </div>

        <!-- Rolled paper visual at the bottom -->
        <div class="paper-roll"></div>
    </div>

</body>
</html>
